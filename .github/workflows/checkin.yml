name: TRAE 每日签到

# 解决「关机 / 休眠导致本机定时任务漏签」：签到跑在 GitHub 云端，
# 与本机是否开机、是否联网完全无关。
on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC + 8。
    # 目标：每天北京时间 00:00 过后第一时间签到（新一天的积分一刷新就领）。
    #   5  16 * * *  -> 北京时间 00:05（主跑）
    #   40 16 * * *  -> 北京时间 00:40（兜底：主跑若遇限流 code 9074 或排队延误，补一次）
    #
    #   5  0  * * *  -> 北京时间 08:05（兜底：仅当 0 点那两次因服务端按 UTC 翻页
    #                    而被判「今天已签」时才会真正生效，正常情况下直接跳过）
    #
    # 为什么铺这么多次：实测 GitHub Actions 的 schedule 延迟很大 —— 设 00:05 的任务
    # 曾在 03:24 才真正启动（延迟 3 小时 19 分）。只靠一次定时，遇到延迟或风控窗口就会漏签。
    # 因此改为「尽早 + 多次覆盖」：00:05 抢头筹，之后每隔几小时补一次。
    # 为什么不是整点 0 分：整点排队最严重，错开到 :05 / :45 更快被调度。
    # 一天跑多次是安全的 —— 脚本先查 status，已签到直接跳过，不会重复领取。
    - cron: '5 16 * * *'    # 北京 00:05
    - cron: '45 16 * * *'   # 北京 00:45
    - cron: '5 20 * * *'    # 北京 04:05
    - cron: '5 0 * * *'     # 北京 08:05
    - cron: '5 4 * * *'     # 北京 12:05
    - cron: '5 12 * * *'    # 北京 20:05（当天最后一次机会）
  workflow_dispatch:        # 允许在任何时候手动点一次「Run workflow」
  push:                     # 首次推送后立即跑一遍，验证凭证是否正确
    paths:
      - 'checkin.py'
      - '.github/workflows/checkin.yml'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # 领取的退避重试最坏约 13 分钟，留足余量
    concurrency:
      group: trae-checkin    # 同一时刻只允许一个签到任务，杜绝并发重复领取
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_SESSION_2: ${{ secrets.TRAE_SESSION_2 }}
          TRAE_DEVICE_ID_2: ${{ secrets.TRAE_DEVICE_ID_2 }}
          TRAE_SESSION_3: ${{ secrets.TRAE_SESSION_3 }}
          TRAE_DEVICE_ID_3: ${{ secrets.TRAE_DEVICE_ID_3 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python checkin.py

      - name: 上传运行日志
        if: always()
        run: echo "签到流程结束，退出码=$?" && date -u
