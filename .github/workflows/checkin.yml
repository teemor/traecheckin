name: TRAE 每日签到

# 解决「关机 / 休眠导致本机定时任务漏签」：签到跑在 GitHub 云端，
# 与本机是否开机、是否联网完全无关。
on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC + 8。
    #
    # 【为什么完全放弃了「北京时间 0 点」】—— 实测结论，见 2026-09-09 运行记录：
    #   设 00:05 -> 实际 03:24 才启动（延迟 3 小时 19 分）
    #   设 00:45 -> 实际 03:33 才启动（延迟 2 小时 48 分）
    # 原因：北京 0 点 = UTC 16:00，正撞上 GitHub Actions 全球最拥堵的时段，
    # 想「准点 0 点签到」在云端根本做不到。同时 0 点也是各类签到脚本扎堆的时刻，
    # 服务端风控（code 9074）在这个窗口最敏感。
    #
    # 【为什么 0 点签到本来就没有收益】
    # 签到积分是定额发放（150 + 连续奖励），不是先到先得的名额竞争，
    # 所以「抢头筹」没有任何额外好处，只有排队和风控两个坏处。
    #
    # 【最终策略：主跑放在早上，全天多点兜底】
    #   7  0  * * *  -> 北京时间 08:07（主跑：避开 UTC 整点排队，且已过风控高峰）
    #   47 0  * * *  -> 北京时间 08:47（紧接兜底：主跑若撞上 9074 风控窗口，40 分钟后补）
    #   7  4  * * *  -> 北京时间 12:07
    #   7  12 * * *  -> 北京时间 20:07（当天最后一次机会）
    #
    # 为什么都不是整点：整点排队最严重，错开到 :07 / :47 反而更早被调度。
    # 一天跑多次是安全的 —— 脚本先查 status，已签到直接跳过，不会重复领取。
    - cron: '7 0 * * *'     # 北京 08:07（主跑）
    - cron: '47 0 * * *'    # 北京 08:47（兜底）
    - cron: '7 4 * * *'     # 北京 12:07（兜底）
    - cron: '7 12 * * *'    # 北京 20:07（兜底）
  workflow_dispatch:        # 允许在任何时候手动点一次「Run workflow」
  push:                     # 首次推送后立即跑一遍，验证凭证是否正确
    paths:
      - 'checkin.py'
      - '.github/workflows/checkin.yml'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # 领取的退避重试最坏约 13 分钟，留足余量
    concurrency:
      group: trae-checkin    # 同一时刻只允许一个签到任务，杜绝并发重复领取
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_SESSION_2: ${{ secrets.TRAE_SESSION_2 }}
          TRAE_DEVICE_ID_2: ${{ secrets.TRAE_DEVICE_ID_2 }}
          TRAE_SESSION_3: ${{ secrets.TRAE_SESSION_3 }}
          TRAE_DEVICE_ID_3: ${{ secrets.TRAE_DEVICE_ID_3 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python checkin.py

      - name: 上传运行日志
        if: always()
        run: echo "签到流程结束，退出码=$?" && date -u
